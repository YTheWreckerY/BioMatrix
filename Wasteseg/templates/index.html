<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenSort Waste Segregation</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        justify-content: flex-start;
    }
    h1 {
        margin: 30px 0 20px;
        font-size: 2.2rem;
        color: #4CAF50;
        text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        text-align: center;
    }
    .video-container {
        position: relative;
        border: 5px solid #4CAF50;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        width: 800px;
        max-width: 95%;
    }
    #video-feed {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 10px;
    }
    #prediction {
        margin-top: 25px;
        font-size: 1.3rem;
        background: rgba(0,0,0,0.5);
        padding: 15px 25px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        max-width: 90%;
        text-align: center;
        line-height: 1.5;
    }
    footer {
        margin-top: 40px;
        font-size: 0.9rem;
        color: #aaa;
    }
</style>
</head>
<body>
<h1>GreenSort: Your Personal Waste Segregation Assistant</h1>
<div class="video-container">
    <img id="video-feed" src="{{ url_for('video_feed') }}">
</div>
<div id="prediction">Waiting for prediction...</div>
<footer>Powered by AI & TensorFlow | Your Eco Companion 🌱</footer>

<script>
async function updatePrediction() {
    try {
        const response = await fetch('/get_result');
        const data = await response.json();
        document.getElementById('prediction').innerText =
            `${data.label}\n${data.strategy}`;
    } catch (e) {
        document.getElementById('prediction').innerText = 'Error fetching prediction';
    }
}
setInterval(updatePrediction, 1000); // every second
</script>
</body>
</html>
